org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.x defaults (do not set deprecated opt-outs such as android.builtInKotlin=false,
# android.newDsl=false, android.enableAppCompileTimeRClass=false,
# android.sdk.defaultTargetSdkToCompileSdkIfUnset=false, android.r8.optimizedResourceShrinking=false,
# android.usesSdkInManifest.disallowed=false, or android.defaults.buildfeatures.resvalues=true).
# Import performance: AGP 9 defaults android.dependency.useConstraints=false (replaces the
# deprecated android.dependency.excludeLibraryComponentsFromConstraints flag).
